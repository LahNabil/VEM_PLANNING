spring.application.name=PRODUCT-SERVICE
server.port=8081
spring.datasource.url= jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/vem_produit?createDatabaseIfNotExist=true
spring.datasource.username=vemuser
spring.datasource.password=vempassword
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.cloud.discovery.enabled=true
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=*
eureka.client.service-url.defaultZone=${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/vivo-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/vivo-realm/protocol/openid-connect/certs

