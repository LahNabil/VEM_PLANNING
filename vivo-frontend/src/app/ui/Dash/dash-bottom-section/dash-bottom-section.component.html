<div class="table-container ">
  <input class="form-control" type="text" placeholder="Search" [(ngModel)]="searchText" >
  <table class="table table-hover table-striped">
    <thead>
    <tr>
      <th>ID</th>
      <th>DEPOT</th>
      <th>ZONE</th>
      <th>AREA</th>
      <th>STOCK</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let e of depots | search:searchText">
      <td>{{e.idDepot}}</td>
      <td>{{e.nameDepot}}</td>
      <td>{{e.zone}}</td>
      <td>{{e.area}}</td>
      <td>{{e.stock}}</td>
    </tr>
    </tbody>
  </table>
</div>
