<div mat-dialog-title>
  <h1>Prevision Form</h1>
</div>
<form [formGroup]="previsionForm" (ngSubmit)="onFormSubmit()">
  <div mat-dialog-content class="content">
    <div class="row">
      <mat-form-field appearance="outline">
        <mat-label>ForeCaste</mat-label>
        <input matInput type="text" placeholder="Ex. MJ71" formControlName="foreCaste">
      </mat-form-field>
      <div class="row">
        <mat-form-field appearance="outline">
          <mat-label>Date</mat-label>
          <input matInput [matDatepicker]="picker" formControlName="date">
          <mat-hint>YYYY/MM/DD</mat-hint>
          <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
      </div>
      <div class="row">
        <mat-radio-group aria-label="Select an option" formControlName="business">
          <mat-label><b>Business</b></mat-label>
          <mat-radio-button value="FUELS">Fuels</mat-radio-button>
          <mat-radio-button value="RETAIL">Retail</mat-radio-button>
          <mat-radio-button value="AVIATION">Aviation</mat-radio-button>
          <mat-radio-button value="MARINE">Marine</mat-radio-button>
          <mat-radio-button value="SUPPLY">Supply</mat-radio-button>
        </mat-radio-group>
      </div>
    </div>
    <mat-form-field>
      <mat-label>Select Product</mat-label>
      <mat-select formControlName="nameProduct">
        <mat-option *ngFor="let product of products" [value]="product.name">{{product.name}}</mat-option>
      </mat-select>
      <mat-hint align="end">Here's the dropdown arrow ^</mat-hint>
    </mat-form-field>
    <mat-form-field appearance="fill">
      <mat-label>Selectionnez une ville</mat-label>
      <mat-select formControlName="supplyEnveloppe">
        <mat-option *ngFor="let ville of villes" [value]="ville">
          {{ ville }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>
  <div mat-dialog-actions class="action">
    <button mat-raised-button type="button" [mat-dialog-close]="false">Cancel</button>
    <button mat-raised-button color="primary" type="submit">Save</button>
  </div>
</form>
