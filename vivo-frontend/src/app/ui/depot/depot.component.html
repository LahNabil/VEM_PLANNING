<div class="p-3">
  <mat-toolbar class="bar">
    <span>Depots</span>
    <span class="example-spacer"></span>
    <button mat-raised-button class="add-button" (click)="openAddForm()">
      ADD Depot
    </button>
    <button mat-raised-button class="download-button" (click)="exportExcel()" >
      Download File
    </button>
  </mat-toolbar>
  <div class="main-body">
    <div class="input-container">
    <mat-form-field class="filter">
      <mat-label>Filter</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Gasoil" #input>
    </mat-form-field>
    </div>

    <div class="table-container">
      <table mat-table [dataSource]="dataSource" matSort id="table-data">
        <ng-container matColumnDef="idDepot">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
          <td mat-cell *matCellDef="let row"> {{row.idDepot}} </td>
        </ng-container>

        <ng-container matColumnDef="nameDepot">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
          <td mat-cell *matCellDef="let row"> {{row.nameDepot}}</td>
        </ng-container>

        <ng-container matColumnDef="zone">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Zone </th>
          <td mat-cell *matCellDef="let row"> {{row.zone}}</td>
        </ng-container>

        <ng-container matColumnDef="area">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Area </th>
          <td mat-cell *matCellDef="let row"> {{row.area}}</td>
        </ng-container>

        <ng-container matColumnDef="bacDtos">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Bacs </th>
          <td mat-cell *matCellDef="let row">
            <div *ngFor="let bacDto of row.bacDtos">
              {{bacDto.idBac}}--{{bacDto.capacityUsed}}m3
            </div>
          </td>
        </ng-container>
        <ng-container matColumnDef="product">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Product</th>
          <td mat-cell *matCellDef="let depot">
            <ng-container *ngIf="depot.bacDtos">
              <div *ngFor="let bacDto of depot.bacDtos">
                <div>{{ bacDto.product?.name }}</div>
                <!-- Display other product properties as needed -->
              </div>
            </ng-container>
          </td>
        </ng-container>

<!--        <ng-container matColumnDef="product">-->
<!--          <th mat-header-cell *matHeaderCellDef mat-sort-header> Product </th>-->
<!--          <td mat-cell *matCellDef="let row">-->
<!--            <div *ngFor="let bacDto of row.bacDtos">-->
<!--              {{bacDto.product}}-->
<!--            </div>-->
<!--          </td>-->
<!--        </ng-container>-->
        <ng-container matColumnDef="stock">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Stock du Depot </th>
          <td mat-cell *matCellDef="let row"> {{row.stock}}</td>
        </ng-container>

        <ng-container matColumnDef="actions" >
          <th mat-header-cell *matHeaderCellDef mat-sort-header id="table-action"> Action </th>
          <td mat-cell *matCellDef="let row">
            <button mat-icon-button color="primary" (click)="openEditForm(row)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deleteDepot(row.idDepot)">
              <mat-icon>delete</mat-icon>
            </button>
            <button mat-icon-button color="primary" (click)="DepotDetail(row.idDepot)">
              <mat-icon>info</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <!-- Row shown when there is no matching data. -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
        </tr>
      </table>


    </div>
    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
  </div>
</div>
