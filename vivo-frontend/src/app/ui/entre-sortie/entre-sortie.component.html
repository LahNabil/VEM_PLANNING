<div class="p-3">
  <mat-toolbar color="primary">
    <span>Entrées Sorties</span>
    <span class="example-spacer"></span>
  </mat-toolbar>
  <div class="main-body">

    <mat-form-field>
      <mat-label>Filter</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Gasoil" #input>
    </mat-form-field>

    <div class="table-container">
      <table mat-table [dataSource]="dataSource" matSort>
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
          <td mat-cell *matCellDef="let row"> {{row.id}} </td>
        </ng-container>

        <ng-container matColumnDef="quantite">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Quantité </th>
          <td mat-cell *matCellDef="let row">
            <span *ngIf="!row.typeES; else entree">-{{row.quantite}}</span>
            <ng-template #entree>{{row.quantite}}</ng-template>
          </td>
        </ng-container>

        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Date </th>
          <td mat-cell *matCellDef="let row"> {{row.date | date:'yyyy/MM/dd'}}</td>
        </ng-container>
        <ng-container matColumnDef="typeES">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Variation de stock </th>
          <td mat-cell *matCellDef="let row">
            <span *ngIf="row.typeES; else sortie">Entrées</span>
            <ng-template #sortie>Sorties</ng-template>
          </td>
        </ng-container>
        <ng-container matColumnDef="business">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Business </th>
          <td mat-cell *matCellDef="let row"> {{row.business}}</td>
        </ng-container>
        <ng-container matColumnDef="idBac">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Bac </th>
          <td mat-cell *matCellDef="let row"> {{row.idBac}}</td>
        </ng-container>
        <ng-container matColumnDef="nameProduct">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Nom du Produit </th>
          <td mat-cell *matCellDef="let row">
              <div>{{row.nameProduct}} </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <!-- Row shown when there is no matching data. -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
        </tr>
      </table>

      <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
    </div>
  </div>
</div>
