<div *ngIf="isStock">
  <h2>Informations sur le stock</h2>
  <p><strong>Prévision:</strong> {{ isStock.forecaste }}</p>
  <p><strong>Stock Actuel:</strong> {{ isStock.stockActuel }}</p>
  <p><strong>Safety Stock:</strong> {{ isStock.safetyStock }}</p>
  <p><strong>Nom du produit:</strong> {{ isStock.nameProduct }}</p>
  <p><strong>Ville:</strong> {{ isStock.ville }}</p>
</div>

<div *ngIf="!isStock">
  <p>Aucune information sur le stock disponible pour cette prévision.</p>
</div>

<button mat-raised-button type="button" [mat-dialog-close]="false">Fermer</button>
