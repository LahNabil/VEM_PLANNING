<div class="p-3">
  <div class="card">
    <div class="card-header">Products</div>
    <div class="card-body">
      <h2>Products</h2>
      <table class="table table-bordered">
        <thead>
        <tr>
          <th>ID</th>
          <th>name</th>
          <th>Status</th>
          <th>Type</th>
          <th>Regime</th>
          <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let product of products">
          <td>{{ product.idProduit }}</td>
          <td>{{ product.name }}</td>
          <td>{{ product.status }}</td> <!-- Use Angular date pipe for formatting -->
          <td>{{ product.type }}</td>
          <td>{{product.regime.regime}}</td>
          <td><a class="btn btn-primary btn-action mr-1" data-toggle="tooltip" title="" data-original-title="Edit"><i class="fas fa-pencil-alt"></i></a>
            <a class="btn btn-danger btn-action" data-toggle="tooltip" title="" data-confirm="Are You Sure?|This action can not be undone. Do you want to continue?" data
            <button class="btnn" (click)="productDetail(product.idProduit)">View Details</button></td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
