<div class="p-3">
  <div class="card">
    <div class="card-header">Products</div>
    <div class="card-body">
      <h2>Products</h2>
      <table class="table table-bordered">
        <thead>
        <tr>
          <th>ID</th>
          <th>name</th>
          <th>Status</th>
          <th>Type</th>
          <th>Regime</th>
          <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let product of products">
          <td>{{ product.id }}</td>
          <td>{{ product.name }}</td>
          <td>{{ product.status }}</td> <!-- Use Angular date pipe for formatting -->
          <td>{{ product.typeProduit }}</td>
          <td>{{product.regime}}</td>
          <td><button class="btnn">View Details</button></td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
