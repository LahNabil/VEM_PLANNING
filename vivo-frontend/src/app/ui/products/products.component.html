<div class="p-3">
  <mat-toolbar class="bar">
    <span>Products</span>
    <span class="example-spacer"></span>
    <button mat-raised-button class="add-button" (click)="openAddForm()">
      ADD Product
    </button>
  </mat-toolbar>
  <div class="main-body">
<div class="input-container">
    <mat-form-field class="filter">
      <mat-label style="font-size: 14px">Filter</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Gasoil"  #input>

    </mat-form-field>

</div>

    <div class="table-container">
      <table mat-table [dataSource]="dataSource " matSort >

        <ng-container matColumnDef="idProduit">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="bluelight-header"> ID </th>
          <td mat-cell *matCellDef="let row"> {{row.idProduit}} </td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
          <td mat-cell *matCellDef="let row " > {{row.name}}</td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="greenlight-header"> status </th>
          <td mat-cell *matCellDef="let row"> {{row.status}}</td>
        </ng-container>

        <ng-container matColumnDef="type">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Grade </th>
          <td mat-cell *matCellDef="let row"> {{row.type }}</td>
        </ng-container>

        <ng-container matColumnDef="regime">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="redlight-header"> Regime </th>
          <td mat-cell *matCellDef="let row"> {{row.regime.regime}}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Action </th>
          <td mat-cell *matCellDef="let row">
            <button mat-icon-button color="primary" (click)="openEditForm(row)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deleteProduct(row.idProduit)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <!-- Row shown when there is no matching data. -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}} "</td>
        </tr>
      </table>
      <tr *ngFor="let e of product | search:searchText">
        <td>{{e.idProduit}}</td>
        <td>{{e.name}}</td>
        <td>{{e.status}}</td>
        <td>{{e.type}}</td>
        <td>{{e.regime.regime}}</td>
      </tr>
    </div>
    <mat-paginator class="paginator" [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
  </div>
</div>
