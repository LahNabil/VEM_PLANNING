<div class="p-3">
  <mat-toolbar class="bar">
    <span>Stock</span>
    <span class="example-spacer"></span>
    <button mat-raised-button class="download-button" (click)="exportExcel()">
      Download File
    </button>
  </mat-toolbar>
  <div class="main-body">

    <mat-form-field style="width: 180px; ">
      <mat-label style="color: #A1CD62; ">Filter</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Gasoil" #input>
    </mat-form-field>

    <div class="table-container">
      <table mat-table [dataSource]="dataSource" matSort id="table-data">
        <ng-container matColumnDef="idHistory">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="bluelight-header"> ID </th>
          <td mat-cell *matCellDef="let row"> {{row.idHistory}} </td>
        </ng-container>
        <ng-container matColumnDef="dateJour">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="greenlight-header"> Date </th>
          <td mat-cell *matCellDef="let row"> {{row.dateJour | date:'yyyy/MM/dd'}}</td>
        </ng-container>

        <ng-container matColumnDef="nameProduct">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="redlight-header"> Nom du Produit </th>
          <td mat-cell *matCellDef="let row"> {{row.nameProduct}}</td>
        </ng-container>

        <ng-container matColumnDef="stock">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="bluelight-header"> Stock </th>
          <td mat-cell *matCellDef="let row"> {{row.stock}} m3</td>
        </ng-container>
        <ng-container matColumnDef="idDepot">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="greenlight-header"> ID du Depot</th>
          <td mat-cell *matCellDef="let row"> {{row.idDepot}}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <!-- Row shown when there is no matching data. -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
        </tr>
      </table>

      <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
    </div>
  </div>
</div>
<app-slider-depot-stock></app-slider-depot-stock>
